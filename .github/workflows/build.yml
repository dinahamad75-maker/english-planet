name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo files
        uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          mkdir extracted
          unzip -q english-planet.zip -d extracted
          if [ -d extracted/english_planet ]; then
            echo "PROJECT_DIR=extracted/english_planet" >> "$GITHUB_ENV"
          else
            proj=$(find extracted -name pubspec.yaml -printf '%h\n' | head -1)
            echo "PROJECT_DIR=$proj" >> "$GITHUB_ENV"
          fi
          ls extracted

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Download packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: english-planet-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
